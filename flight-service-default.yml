server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flightdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  algorithm:
    key: ${KEY}

  issuer: ${ISSUER}

  expiration:
    time: ${TIME}
